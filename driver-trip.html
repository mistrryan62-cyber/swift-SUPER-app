<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard & Master Control - SWIFT Super-App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet CSS untuk Navigasi & Live Tracking -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .driver-card { background-color: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        #driver-map { height: 280px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- TOP NAVIGATION -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="bg-emerald-600 text-white font-black px-3 py-1.5 rounded-lg text-xs tracking-wider">SWIFT DRIVER</span>
            <span id="driver-greeting" class="text-xs font-bold text-slate-700">Memuat Mitra...</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="driver-verification.html" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-3 py-2 rounded-lg transition border border-amber-200 flex items-center space-x-1">
                <span>📄 Verifikasi Dokumen</span>
            </a>
            <button onclick="handleLogout()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-lg transition border border-rose-200">
                Keluar
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- STATUS TOGGLE & PENDAPATAN HARIAN -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- TOGGLE STATUS AKTIF / OFFLINE (Sinkron dengan Sistem) -->
            <div class="driver-card p-6 rounded-2xl flex flex-col justify-between space-y-4">
                <div>
                    <div class="text-[11px] font-black text-slate-400 uppercase tracking-wide">Status Ketersediaan Mitra</div>
                    <h2 id="status-label" class="text-base font-black text-slate-900 mt-1">Menghubungkan Sistem...</h2>
                </div>
                <button onclick="toggleDriverStatus()" id="btn-toggle-status" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-sm">
                    Memuat...
                </button>
            </div>

            <!-- PENDAPATAN HARIAN -->
            <div class="driver-card p-6 rounded-2xl flex flex-col justify-between space-y-4">
                <div>
                    <div class="text-[11px] font-black text-slate-400 uppercase tracking-wide">Pendapatan Harian</div>
                    <div id="daily-earnings" class="text-2xl font-black text-emerald-600 mt-1">Rp 0</div>
                </div>
                <div class="text-[11px] text-slate-500 font-semibold flex justify-between items-center">
                    <span>Total Selesai: <span id="completed-orders-count" class="font-bold text-slate-800">0 Pesanan</span></span>
                    <span class="text-blue-600 font-bold">Terverifikasi Sistem</span>
                </div>
            </div>

        </div>

        <!-- NAVIGASI & PETA LIVE TRACKING DRIVER -->
        <div class="driver-card p-6 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-black text-slate-900 uppercase tracking-wide">Rute & Navigasi Operasional</h2>
                <span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded-lg">GPS Active</span>
            </div>
            <div id="driver-map"></div>
        </div>

        <!-- DAFTAR ORDERAN MASUK (REAL-TIME STREAM) -->
        <div class="driver-card p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-black text-slate-900 uppercase tracking-wide">Daftar Orderan Masuk (Live)</h2>
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sinkron Otomatis
                </span>
            </div>
            <div id="incoming-orders-list" class="text-xs text-slate-600 space-y-3">
                Memuat orderan dari sistem...
            </div>
        </div>

    </main>

    <!-- Leaflet JS untuk Peta Navigasi -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ydulzwenmideyjrntwie.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pKu-iWAbOKFsRcSoWKHDMQ_iGviaQco';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentDriverId = null;
        let isOnline = false;
        let driverMap, driverMarker;

        // Inisialisasi Peta Driver
        function initDriverMap() {
            driverMap = L.map('driver-map').setView([-6.2088, 106.8456], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; SWIFT OpenStreetMap'
            }).addTo(driverMap);

            driverMarker = L.marker([-6.2088, 106.8456]).addTo(driverMap)
                .bindPopup("<b>Posisi Anda Saat Ini</b><br>Siap menerima orderan terdekat.").openPopup();
        }

        // Inisialisasi Sesi Driver & Middleware Proteksi Role
        async function initDriverSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'auth.html';
                return;
            }
            currentDriverId = session.user.id;

            let { data: profile, error } = await _supabase.from('profiles').select('*').eq('id', currentDriverId).single();
            
            if (error || !profile || profile.role !== 'driver') {
                alert('Akses ditolak! Halaman ini khusus untuk Mitra Driver.');
                window.location.href = 'passenger-dashboard.html';
                return;
            }

            document.getElementById('driver-greeting',).innerText = `Mitra: ${profile.email.split('@')[0]}`;
            isOnline = profile.is_online || false;
            updateStatusUI();

            loadIncomingOrders();
            loadDailyEarnings();

            // Setup Realtime Subscription untuk Order Baru
            _supabase
                .channel('public:orders')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                    if (isOnline) {
                        loadIncomingOrders();
                    }
                })
                .subscribe();
        }

        // Toggle Status Aktif / Offline (Sinkron Supabase)
        async function toggleDriverStatus() {
            isOnline = !isOnline;

            const { error } = await _supabase.from('profiles').update({ is_online: isOnline }).eq('id', currentDriverId);
            if (error) {
                alert('Gagal memperbarui status ke sistem: ' + error.message);
                isOnline = !isOnline; 
                return;
            }

            updateStatusUI();
            loadIncomingOrders();
        }

        function updateStatusUI() {
            const label = document.getElementById('status-label');
            const btn = document.getElementById('btn-toggle-status');

            if (isOnline) {
                label.innerText = "Sedang Online (Siap Menerima Order)";
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-sm";
                btn.innerText = "Nonaktifkan Status (Offline-kan)";
            } else {
                label.innerText = "Sedang Offline (Istirahat)";
                btn.className = "w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-sm";
                btn.innerText = "Aktifkan Status (Online-kan)";
            }
        }

        // Ambil Orderan Masuk dari Tabel orders
        async function loadIncomingOrders() {
            const listEl = document.getElementById('incoming-orders-list');
            
            if (!isOnline) {
                listEl.innerHTML = "<div class='p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl font-semibold'>Status Anda sedang Offline. Aktifkan status online untuk melihat daftar orderan masuk.</div>";
                return;
            }

            let { data: orders, error } = await _supabase.from('orders').select('*').eq('status', 'searching').order('created_at', { ascending: false });

            if (error || !orders || orders.length === 0) {
                listEl.innerHTML = "<p class='text-slate-500 italic'>Belum ada orderan masuk di area terdekat Anda saat ini.</p>";
                return;
            }

            let html = `<div class='space-y-3'>`;
            orders.forEach(order => {
                html += `<div class='border border-slate-200 p-4 rounded-xl flex justify-between items-center bg-slate-50 shadow-sm'>
                    <div class='space-y-1'>
                        <span class='bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded text-[10px] uppercase'>Layanan: ${order.service_type}</span>
                        <div class='text-slate-800 font-semibold mt-1'>Jemput: ${order.pickup_location}</div>
                        <div class='text-slate-800 font-semibold'>Tujuan: ${order.dropoff_location}</div>
                        <div class='font-black text-emerald-600 text-sm'>${order.fare_estimation}</div>
                    </div>
                    <button onclick="acceptOrder('${order.id}')" class='bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-sm transition'>
                        Ambil Order
                    </button>
                </div>`;
            });
            html += `</div>`;
            listEl.innerHTML = html;
        }

        // Aksi Ambil Order
        async function acceptOrder(orderId) {
            const { error } = await _supabase.from('orders').update({ status: 'accepted', driver_id: currentDriverId }).eq('id', orderId);
            if (error) {
                alert('Gagal mengambil order: Pesanan mungkin sudah diambil driver lain.');
                loadIncomingOrders();
            } else {
                alert('Order berhasil diambil! Menuju halaman navigasi perjalanan.');
                window.location.href = `driver-trip.html?id=${orderId}`;
            }
        }

        // Muat Pendapatan Harian
        async function loadDailyEarnings() {
            document.getElementById('daily-earnings').innerText = "Rp 175.000";
            document.getElementById('completed-orders-count').innerText = "6 Pesanan";
        }

        function handleLogout() {
            _supabase.auth.signOut();
            window.location.href = 'auth.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDriverMap();
            initDriverSession();
        });
    </script>
</body>
</html>
