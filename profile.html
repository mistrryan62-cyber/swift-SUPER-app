<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFT — Profil Akun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#030712', cardbg: '#0f172a', cardborder: '#1e293b' } } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, sans-serif; padding-bottom: 40px; }
        .swift-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @media (min-width: 768px) {
            body { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); padding: 24px 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
            .app-wrapper { width: 100%; max-width: 480px; background: #030712; border-radius: 36px; border: 1px solid #1e293b; overflow: hidden; position: relative; }
        }
        @media (max-width: 767px) { .app-wrapper { width: 100%; } }
    </style>
</head>
<body class="antialiased">
<div class="app-wrapper">
    <header class="bg-[#0b0f19] border-b border-[#1e293b] p-4 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="text-slate-400 hover:text-white text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="text-sm font-black text-white uppercase tracking-wider">Profil Pengguna</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 flex flex-col gap-4">
        <!-- Info Akun -->
        <div class="swift-card flex items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center text-emerald-400 text-2xl font-black">
                SW
            </div>
            <div>
                <h3 class="font-extrabold text-white text-base">Master Enterprise User</h3>
                <p class="text-xs text-slate-400">user@swift-ecosystem.com</p>
                <span class="inline-block mt-1 text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2.5 py-0.5 rounded-full border border-emerald-500/30">Verified Member</span>
            </div>
        </div>

        <!-- Menu Opsi -->
        <div class="swift-card space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pengaturan Akun</h3>
            <div class="space-y-2 text-xs font-semibold">
                <a href="#" onclick="alert('Fitur edit profil')" class="flex justify-between items-center p-3 bg-slate-900 rounded-2xl hover:bg-slate-800 transition text-slate-200">
                    <span><i class="fa-solid fa-user-pen mr-2 text-purple-400"></i> Edit Informasi Pribadi</span>
                    <i class="fa-solid fa-chevron-right text-slate-500"></i>
                </a>
                <a href="#" onclick="alert('Keamanan akun')" class="flex justify-between items-center p-3 bg-slate-900 rounded-2xl hover:bg-slate-800 transition text-slate-200">
                    <span><i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i> Keamanan & Sandi</span>
                    <i class="fa-solid fa-chevron-right text-slate-500"></i>
                </a>
                <a href="swift-master-admin.html" class="flex justify-between items-center p-3 bg-blue-950/40 rounded-2xl hover:bg-blue-900/40 transition text-blue-400 border border-blue-800/50">
                    <span><i class="fa-solid fa-gauge mr-2"></i> Buka Master Admin Panel</span>
                    <i class="fa-solid fa-chevron-right text-blue-500"></i>
                </a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
