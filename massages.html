<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFT — Pesan & Notifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#030712', cardbg: '#0f172a', cardborder: '#1e293b' } } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, sans-serif; padding-bottom: 40px; }
        .swift-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @media (min-width: 768px) {
            body { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); padding: 24px 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
            .app-wrapper { width: 100%; max-width: 480px; background: #030712; border-radius: 36px; border: 1px solid #1e293b; overflow: hidden; position: relative; }
        }
        @media (max-width: 767px) { .app-wrapper { width: 100%; } }
    </style>
</head>
<body class="antialiased">
<div class="app-wrapper">
    <header class="bg-[#0b0f19] border-b border-[#1e293b] p-4 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="text-slate-400 hover:text-white text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="text-sm font-black text-white uppercase tracking-wider">Pesan & Siaran</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 flex flex-col gap-4">
        <div class="swift-card space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-bullhorn mr-1 text-purple-400"></i> Siaran Pengumuman Master Admin</h3>
            <div id="announcement-box" class="p-4 bg-purple-950/30 border border-purple-800/50 rounded-2xl text-xs text-purple-200 space-y-1">
                <div class="font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-circle-info text-purple-400"></i> Pengumuman Aktif Pusat</div>
                <p id="announcement-text" class="text-slate-300">Memuat pengumuman dari Master Command Tower...</p>
            </div>
        </div>

        <div class="swift-card space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kotak Masuk Transaksi</h3>
            <div class="space-y-2 text-xs">
                <div class="p-3.5 bg-slate-900 rounded-2xl border border-slate-800 space-y-1">
                    <div class="flex justify-between font-bold text-white">
                        <span>Verifikasi Akun Berhasil</span>
                        <span class="text-[10px] text-slate-400">Hari ini</span>
                    </div>
                    <p class="text-slate-400">Selamat! Akun SWIFT Enterprise Anda telah diverifikasi sepenuhnya oleh sistem pusat.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    window.onload = () => {
        const ann = localStorage.getItem('swift_global_announcement');
        const textEl = document.getElementById('announcement-text');
        if(ann) {
            textEl.innerText = ann;
        } else {
            textEl.innerText = "Tidak ada pengumuman darurat atau siaran aktif saat ini dari Master Admin.";
        }
    }
</script>
</body>
</html>
