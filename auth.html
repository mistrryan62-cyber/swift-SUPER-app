<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mitra Usaha / Kedai - SWIFT Enterprise Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .swift-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

    <!-- TOP NAVIGATION -->
    <header class="bg-[#0f172a] border-b border-[#1e293b] h-16 flex items-center justify-between px-6 sticky top-0 z-50 shadow-lg backdrop-blur-md">
        <div class="max-w-md w-full mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <span class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-extrabold px-3 py-1.5 rounded-xl text-xs tracking-wider uppercase">SWIFT MERCHANT</span>
                <span id="merchant-name-header" class="text-xs font-bold text-gray-300">Kedai / Niaga</span>
            </div>
            <button onclick="handleLogout()" class="text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-bold px-3.5 py-2 rounded-xl transition border border-rose-500/30 shadow-md">
                Keluar
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-4 md:p-6 space-y-6 flex-1 flex flex-col">

        <!-- PENDAPATAN & STATUS KEDAI -->
        <div class="swift-card p-6 bg-gradient-to-br from-[#0f172a] to-emerald-950/40 border-l-4 border-emerald-500 space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-[10px] font-black text-emerald-400 uppercase tracking-wider">Pendapatan Hari Ini</span>
                    <h2 id="merchant-earnings" class="text-2xl font-black text-white mt-1">Rp 0</h2>
                </div>
                <button onclick="toggleStoreStatus()" id="btn-store-status" class="px-3 py-1.5 rounded-xl text-[10px] font-extrabold uppercase transition border shadow-md">
                    Memuat Status...
                </button>
            </div>
            <div class="text-[11px] text-gray-400 font-semibold border-t border-[#1e293b] pt-3 flex justify-between items-center">
                <span>Total Pesanan Selesai: <span id="merchant-completed-count" class="font-bold text-white">0</span></span>
                <span class="text-emerald-400 font-bold">🟢 Node Aktif</span>
            </div>
        </div>

        <!-- DAFTAR PESANAN MASUK -->
        <div class="swift-card p-6 space-y-4 flex-1">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Pesanan Masuk Terbaru</h3>
                <button onclick="loadMerchantOrders()" class="text-xs font-bold text-emerald-400 hover:underline">Perbarui</button>
            </div>
            <div id="merchant-orders-list" class="space-y-3 text-xs text-gray-400">
                Memuat pesanan kedai dari pusat sistem...
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center text-[11px] text-gray-500 font-mono py-4">
        &copy; 2026 SWIFT Super-App Security Protocol. Merchant Node #030712.
    </footer>

    <!-- SKRIP LOGIKA MERCHANT -->
    <script>
        const SUPABASE_URL = 'https://ydulzwenmideyjrntwie.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pKu-iWAbOKFsRcSoWKHDMQ_iGviaQco';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMerchantId = null;
        let isStoreOpen = true;

        async function initMerchantSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'Auth.html';
                return;
            }
            currentMerchantId = session.user.id;

            // Ambil profil atau data kedai
            let { data: profile } = await _supabase.from('profiles').select('*').eq('id', currentMerchantId).single();
            if (profile) {
                document.getElementById('merchant-name-header').innerText = profile.full_name || profile.email.split('@')[0];
                isStoreOpen = profile.is_online !== undefined ? profile.is_online : true;
                updateStoreUI();
            }

            loadMerchantOrders();
            loadMerchantEarnings();
        }

        async function toggleStoreStatus() {
            isStoreOpen = !isStoreOpen;
            const { error } = await _supabase.from('profiles').update({ is_online: isStoreOpen }).eq('id', currentMerchantId);
            if (error) {
                alert('Gagal memperbarui status kedai: ' + error.message);
                isStoreOpen = !isStoreOpen;
                return;
            }
            updateStoreUI();
        }

        function updateStoreUI() {
            const btn = document.getElementById('btn-store-status');
            if (isStoreOpen) {
                btn.className = "px-3 py-1.5 rounded-xl text-[10px] font-extrabold uppercase transition border shadow-md bg-emerald-500/20 text-emerald-300 border-emerald-500/40 hover:bg-emerald-500/30";
                btn.innerText = "Kedai: Buka (Aktif)";
            } else {
                btn.className = "px-3 py-1.5 rounded-xl text-[10px] font-extrabold uppercase transition border shadow-md bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30";
                btn.innerText = "Kedai: Tutup (Tidur)";
            }
        }

        async function loadMerchantOrders() {
            const listEl = document.getElementById('merchant-orders-list');
            
            // Ambil orderan tipe merchant/food yang masuk
            let { data: orders, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('service_type', 'food')
                .order('created_at', { ascending: false });

            if (error || !orders || orders.length === 0) {
                listEl.innerHTML = "<div class='p-6 text-center text-gray-500 font-mono text-xs bg-[#030712] rounded-xl border border-[#1e293b]'>Belum ada pesanan kuliner masuk saat ini. Menunggu pembeli...</div>";
                return;
            }

            let html = `<div class='space-y-3'>`;
            orders.forEach(order => {
                html += `<div class='bg-[#030712] p-4 rounded-xl border border-[#1e293b] space-y-2 shadow-md'>
                    <div class='flex justify-between items-center'>
                        <span class='text-white font-bold text-xs'>Pesanan #${order.id.slice(0, 6)}</span>
                        <span class='text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded uppercase font-bold'>${order.status}</span>
                    </div>
                    <p class='text-gray-300 text-xs font-semibold'>Tujuan: ${order.dropoff_location}</p>
                    <p class='font-black text-emerald-400 text-sm'>${order.fare_estimation}</p>
                    <div class='flex gap-2 pt-1'>
                        <button onclick="updateOrderStatus('${order.id}', 'accepted')" class='flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition shadow-sm'>Terima</button>
                        <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class='flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg text-xs transition shadow-sm'>Tolak</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
            listEl.innerHTML = html;
        }

        async function updateOrderStatus(orderId, newStatus) {
            const { error } = await _supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
            if (error) {
                alert('Gagal memperbarui status pesanan: ' + error.message);
            } else {
                alert(`Pesanan berhasil ${newStatus === 'accepted' ? 'diterima' : 'ditolak'}!`);
                loadMerchantOrders();
            }
        }

        async function loadMerchantEarnings() {
            document.getElementById('merchant-earnings').innerText = "Rp 450.000";
            document.getElementById('merchant-completed-count').innerText = "14 Pesanan";
        }

        function handleLogout() {
            _supabase.auth.signOut();
            window.location.href = 'Auth.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMerchantSession();
        });
    </script>
</body>
</html>
