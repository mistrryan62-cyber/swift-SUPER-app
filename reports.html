<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFT — Laporan Analitik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#030712', cardbg: '#0f172a', cardborder: '#1e293b' } } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, sans-serif; padding-bottom: 40px; }
        .swift-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @media (min-width: 768px) {
            body { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); padding: 24px 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
            .app-wrapper { width: 100%; max-width: 480px; background: #030712; border-radius: 36px; border: 1px solid #1e293b; overflow: hidden; position: relative; }
        }
        @media (max-width: 767px) { .app-wrapper { width: 100%; } }
    </style>
</head>
<body class="antialiased">
<div class="app-wrapper">
    <header class="bg-[#0b0f19] border-b border-[#1e293b] p-4 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="text-slate-400 hover:text-white text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="text-sm font-black text-white uppercase tracking-wider">Laporan Analitik</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="swift-card border-l-4 border-purple-500">
                <span class="text-[10px] text-slate-400 font-bold uppercase">Total Transaksi</span>
                <h3 class="text-2xl font-black text-white mt-1">12</h3>
                <span class="text-[10px] text-purple-400 font-semibold">Bulan Berjalan</span>
            </div>
            <div class="swift-card border-l-4 border-emerald-500">
                <span class="text-[10px] text-slate-400 font-bold uppercase">Cashback Diterima</span>
                <h3 class="text-2xl font-black text-emerald-400 mt-1">RM 24.50</h3>
                <span class="text-[10px] text-emerald-400 font-semibold">100% Sukses</span>
            </div>
        </div>

        <div class="swift-card space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-chart-pie mr-1 text-blue-400"></i> Statistik Penggunaan Modul</h3>
            <div class="space-y-2 text-xs text-slate-300">
                <div>
                    <div class="flex justify-between mb-1 font-bold"><span>Layanan Food & Mart</span><span>65%</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full w-[65%]"></div></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1 font-bold"><span>Ride & Transport</span><span>25%</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div class="bg-purple-500 h-full w-[25%]"></div></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1 font-bold"><span>Express Delivery</span><span>10%</span></div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div class="bg-blue-500 h-full w-[10%]"></div></div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
