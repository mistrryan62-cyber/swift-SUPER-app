<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFT Food - Merchant Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header Merchant -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="bg-amber-600 text-white font-black px-3 py-1 rounded-lg text-[10px]">SWIFT FOOD MERCHANT</span>
                <h1 id="merchant-title" class="text-lg font-black text-slate-900 mt-2">Restoran & Kuliner</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleStoreStatus()" id="btn-store-status" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs transition">Toko Buka</button>
                <button onclick="logoutMerchant()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-4 py-2 rounded-xl text-xs transition">Keluar</button>
            </div>
        </div>

        <!-- Pengaturan Jam Operasional -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <h2 class="text-sm font-black text-slate-900 uppercase tracking-wide">Jam Operasional Toko</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Jam Buka</label>
                    <input type="time" id="open-time" class="w-full border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50" value="08:00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Jam Tutup</label>
                    <input type="time" id="close-time" class="w-full border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50" value="22:00">
                </div>
            </div>
            <button onclick="saveOperationalHours()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition">Simpan Jam Operasional</button>
        </div>

        <!-- Tambah Menu Makanan Terstruktur -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <h2 class="text-sm font-black text-slate-900 uppercase tracking-wide">Kelola Katalog Produk Makanan</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="food-name" placeholder="Nama Makanan/Minuman" class="border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50">
                <input type="number" id="food-price" placeholder="Harga (Rp)" class="border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50">
                <select id="food-category" class="border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50 font-bold text-slate-700">
                    <option value="Makanan Utama">Makanan Utama</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Camilan">Camilan / Snack</option>
                </select>
            </div>
            <button onclick="addFoodMenu()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition">Tambah Produk ke Katalog</button>
        </div>

        <!-- Daftar Menu Aktif -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <h2 class="text-sm font-black text-slate-900 uppercase tracking-wide">Daftar Menu Tersedia</h2>
            <div id="menu-list-container" class="space-y-2">
                <p class="text-xs text-slate-400 italic">Memuat katalog menu...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ydulzwenmideyjrntwie.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pKu-iWAbOKFsRcSoWKHDMQ_iGviaQco';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let merchantId = null;
        let isStoreOpen = true;

        async function initMerchant() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'auth.html'; return; }
            merchantId = session.user.id;

            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', merchantId).single();
            if (profile) {
                isStoreOpen = profile.is_open ?? true;
                updateStoreStatusUI();
                if (profile.open_hour) document.getElementById('open-time').value = profile.open_hour.substring(0,5);
                if (profile.close_hour) document.getElementById('close-time').value = profile.close_hour.substring(0,5);
            }
            loadFoodMenus();
        }

        async function toggleStoreStatus() {
            isStoreOpen = !isStoreOpen;
            await _supabase.from('profiles').update({ is_open: isStoreOpen }).eq('id', merchantId);
            updateStoreStatusUI();
        }

        function updateStoreStatusUI() {
            const btn = document.getElementById('btn-store-status');
            if (isStoreOpen) {
                btn.innerText = "Toko Buka (Aktif)";
                btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition";
            } else {
                btn.innerText = "Toko Tutup (Istirahat)";
                btn.className = "bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition";
            }
        }

        async function saveOperationalHours() {
            const openHour = document.getElementById('open-time').value;
            const closeHour = document.getElementById('close-time').value;

            const { error } = await _supabase.from('profiles').update({ open_hour: openHour + ':00', close_hour: closeHour + ':00' }).eq('id', merchantId);
            if (error) alert('Gagal menyimpan jam operasional: ' + error.message);
            else alert('Jam operasional berhasil diperbarui!');
        }

        async function addFoodMenu() {
            const name = document.getElementById('food-name').value;
            const price = parseFloat(document.getElementById('food-price').value);
            const category = document.getElementById('food-category').value;

            if (!name || !price) { alert('Mohon lengkapi nama dan harga menu!'); return; }

            const { error } = await _supabase.from('food_menus').insert([{ merchant_id: merchantId, name, price, category, is_available: true }]);
            if (error) {
                alert('Gagal menambah menu: ' + error.message);
            } else {
                alert('Menu makanan berhasil ditambahkan!');
                document.getElementById('food-name').value = '';
                document.getElementById('food-price').value = '';
                loadFoodMenus();
            }
        }

        async function loadFoodMenus() {
            const { data, error } = await _supabase.from('food_menus').select('*').eq('merchant_id', merchantId);
            const container = document.getElementById('menu-list-container');

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 italic">Belum ada menu makanan yang terdaftar.</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${item.category}</span>
                        <h4 class="text-xs font-bold text-slate-800 mt-1">${item.name}</h4>
                        <p class="text-xs font-black text-emerald-600">Rp ${item.price.toLocaleString('id-ID')}</p>
                    </div>
                    <span class="text-[10px] font-bold ${item.is_available ? 'text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full' : 'text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full'}">
                        ${item.is_available ? 'Tersedia' habis}
                    </span>
                </div>
            `).join('');
        }

        function logoutMerchant() { _supabase.auth.signOut(); window.location.href = 'auth.html'; }
        initMerchant();
    </script>
</body>
</html>
