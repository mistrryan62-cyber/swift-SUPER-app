<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFT — Riwayat Aktivitas & Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#030712', cardbg: '#0f172a', cardborder: '#1e293b' } } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, sans-serif; padding-bottom: 40px; }
        .swift-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @media (min-width: 768px) {
            body { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); padding: 24px 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
            .app-wrapper { width: 100%; max-width: 480px; background: #030712; border-radius: 36px; border: 1px solid #1e293b; overflow: hidden; position: relative; }
        }
        @media (max-width: 767px) { .app-wrapper { width: 100%; } }
        ::-webkit-scrollbar { width: 4px; }::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="antialiased">
<div class="app-wrapper">
    <header class="bg-[#0b0f19] border-b border-[#1e293b] p-4 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="text-slate-400 hover:text-white text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="text-sm font-black text-white uppercase tracking-wider">Riwayat Aktivitas</h1>
        <button onclick="clearLogs()" class="text-xs text-red-400 hover:text-red-300 font-bold bg-red-950/40 px-2.5 py-1 rounded-xl border border-red-800/40">Hapus</button>
    </header>

    <main class="p-4 flex flex-col gap-4">
        <div class="swift-card space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-clock-rotate-left mr-1 text-emerald-400"></i> Log Aktivitas Pengguna Nyata</h3>
                <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">Real-Time Sync</span>
            </div>
            <div id="activity-log-container" class="space-y-2 max-h-[450px] overflow-y-auto pr-1 text-xs font-mono">
                <!-- Render via JavaScript -->
            </div>
        </div>
    </main>
</div>

<script>
    function loadLogs() {
        const container = document.getElementById('activity-log-container');
        const logs = JSON.parse(localStorage.getItem('swift_user_activity_logs') || '[]');
        if (logs.length === 0) {
            container.innerHTML = `<div class="text-slate-500 text-center py-6 italic">// Belum ada riwayat aktivitas tercatat. Lakukan navigasi atau aksi di index.html</div>`;
            return;
        }
        container.innerHTML = logs.map(l => `
            <div class="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 text-slate-300 flex items-start gap-2.5 shadow-sm">
                <i class="fa-solid fa-circle-check text-emerald-400 mt-0.5"></i>
                <div class="flex-1 break-all">${typeof l === 'object' ? `[${l.time}] ${l.activity} (${l.region || 'MYR'})` : l}</div>
            </div>
        `).join('');
    }

    function clearLogs() {
        if(confirm("Hapus seluruh catatan riwayat aktivitas?")) {
            localStorage.removeItem('swift_user_activity_logs');
            loadLogs();
        }
    }

    window.onload = loadLogs;
</script>
</body>
</html>
